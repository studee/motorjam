<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotorJam Racer – Get it on Google Play</title>
<meta name="description" content="Motorcycle duels on real roads. Free on Google Play.">
<meta property="og:title" content="MotorJam Racer">
<meta property="og:description" content="Motorcycle duels on real roads. Free on Google Play.">
<meta property="og:image" content="https://motorjam.jackofall.app/get/shot.jpg">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #0b0d10; color: #fff; font: 16px/1.4 system-ui, -apple-system, Roboto, sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; box-sizing: border-box; }
  img.shot { width: 100%; max-width: 520px; border-radius: 14px; }
  img.icon { width: 96px; height: 96px; border-radius: 22px; margin-top: -48px; border: 3px solid #0b0d10; }
  h1 { font-size: 26px; margin: 12px 0 4px; letter-spacing: .5px; }
  p { color: #ffc77f; margin: 0 0 22px; }
  a.btn { display: block; width: 100%; max-width: 360px; padding: 18px 0; border-radius: 14px; background: #2ecc71; color: #062b12;
          font-weight: 800; font-size: 20px; text-decoration: none; }
  small { color: #8a93a0; margin-top: 14px; display: block; }
</style>
</head>
<body>
<img class="shot" src="shot.jpg" alt="MotorJam Racer gameplay">
<img class="icon" src="icon.png" alt="">
<h1>MOTORJAM RACER</h1>
<p>Motorcycle duels on real roads. Free.</p>
<a class="btn" id="go" href="https://play.google.com/store/apps/details?id=com.jackofall.motorjam">GET IT ON GOOGLE PLAY</a>
<small>Opens the Google Play Store</small>
<script>
// Opens the Play Store APP (not Play's web page): from TikTok's in-app browser, the web page makes people sign in or
// tap through, and most give up. The visit's utm_* tags go on as the install referrer, so the Play Console's
// acquisition report shows which campaign brought an install.
(function () {
  var id = "com.jackofall.motorjam";
  var q = new URLSearchParams(location.search);
  var ref = [];
  ["utm_source", "utm_medium", "utm_campaign", "utm_content"].forEach(function (k) { if (q.get(k)) ref.push(k + "=" + q.get(k)); });
  if (!q.get("utm_source")) ref.unshift("utm_source=tiktok");
  var referrer = encodeURIComponent(ref.join("&"));
  var web = "https://play.google.com/store/apps/details?id=" + id + "&referrer=" + referrer;
  var android = /Android/i.test(navigator.userAgent);
  var intent = "intent://details?id=" + id + "&referrer=" + referrer +
    "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  var go = document.getElementById("go");
  go.href = android ? intent : web;
  if (android) { setTimeout(function () { location.href = intent; }, 150); }
})();
</script>
</body>
</html>
